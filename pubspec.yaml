name: office_time_tracker
description: "Office Time Tracking App"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.65.0
  path_provider: ^2.1.1
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0

dev_dependencies:
